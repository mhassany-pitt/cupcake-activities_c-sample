statement: |
  Implement a `transfer` sequence or function in `main` to move money from one `BankAccount` to another.
  Ensure that money is withdrawn from the current account only if funds are sufficient, and deposited into the target account.
executions:
  - title: Transfer Alice to Bob
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        #include <stdio.h>
        #include <string.h>

        typedef struct {
            char owner[50];
            int balance;
        } BankAccount;

        void init_account(BankAccount* account, const char* owner, int balance) {
            strncpy(account->owner, owner, sizeof(account->owner) - 1);
            account->owner[sizeof(account->owner) - 1] = '\0';
            account->balance = balance;
        }

        int deposit(BankAccount* account, int amount) {
            if (amount > 0) {
                account->balance = account->balance + amount;
                printf("Deposited %d\n", amount);
            }
            return account->balance;
        }

        int withdraw(BankAccount* account, int amount) {
            if (0 < amount && amount <= account->balance) {
                account->balance = account->balance - amount;
                printf("Withdrew %d\n", amount);
            } else {
                printf("Insufficient funds\n");
            }
            return account->balance;
        }
  - type: editable
    location:
      snippet: |-
        BankAccount account;
            init_account(&account, "Bob", 200);
            deposit(&account, 100);
            withdraw(&account, 50);
            printf("Balance: %d\n", account.balance);
