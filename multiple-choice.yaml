question: |
  Given the following C struct definition:
  
  ```c
  typedef struct {
      char owner[50];
      int balance;
  } BankAccount;
  ```
  
  Which of the following represents the correct implementation for a `deposit` function in C that validates positive deposit amounts, modifies the original `BankAccount` struct, and returns the new balance?
choices:
  - body: |
      ```c
      int deposit(BankAccount* account, int amount) {
          if (amount > 0) {
              account->balance += amount;
              return account->balance;
          }
          return account->balance;
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Accepts a pointer (`BankAccount* account`) so mutations apply directly to the caller's struct.
          2. Accesses and updates the member using the pointer arrow operator `account->balance += amount`.
          3. Validates that `amount > 0`.
          4. Returns the updated balance.
  - body: |
      ```c
      int deposit(BankAccount account, int amount) {
          if (amount > 0) {
              account.balance += amount;
              return account.balance;
          }
          return account.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In C, parameters passed by value receive a stack copy of the struct. Modifying `account.balance` updates only the local copy, leaving the caller's original struct unmodified.
  - body: |
      ```c
      int deposit(BankAccount* account, int amount) {
          if (amount > 0) {
              account->balance =+ amount;
              return account->balance;
          }
          return account->balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`account->balance = +amount`), which overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```c
      int deposit(BankAccount* account, int amount) {
          if (amount > 0) {
              account.balance += amount;
              return account.balance;
          }
          return account.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. `account` is a pointer (`BankAccount*`), so members cannot be accessed using the dot (`.`) operator (`account.balance`). Doing so causes a C compilation error: `member reference type 'BankAccount *' is a pointer; did you mean to use '->'?`.
