$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: main.c
title: Bank Account Functions and Initialization in C
description: Rearrange the C functions to properly manage BankAccount struct state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - structs
    - pointers
  topics:
    - structs
    - pointers
    - functions
    - conditional-logic
    - memory-safety
runtime:
  language: c
  version: 11
statement: |
  Rearrange the blocks to correctly implement the initialization, deposit, and withdrawal functions for the `BankAccount` struct in C.
  Make sure to:
  1. Initialize the struct fields safely via pointer dereferencing (`->`) and guarantee string null-termination.
  2. Implement the `deposit` function with positive input validation.
  3. Implement the `withdraw` function with strict overdraft protection and insufficient funds notification.
hints:
  - "Arrange the code blocks in logical sequential order from initialization to final output."
  - "Ensure correct block indentation where applicable."
testcases:
  - title: Standard Transaction
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Correct! All blocks are sequenced properly to produce the expected output."
      on_fail:
        - "The block ordering or indentation is incorrect. Re-examine the flow of execution."
elements:
  - type: block
    group: bank-functions
    location:
      snippet: |-
        void init_account(BankAccount* account, const char* owner, int balance) {
            strncpy(account->owner, owner, sizeof(account->owner) - 1);
            account->owner[sizeof(account->owner) - 1] = '\0';
            account->balance = balance;
        }
    choices:
      - snippet: |-
          void init_account(BankAccount* account, const char* owner, int balance) {
              strncpy(account->owner, owner, sizeof(account->owner) - 1);
              account->owner[sizeof(account->owner) - 1] = '\0';
              account->balance = balance;
          }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Safely copies the string into the struct's buffer with bounds protection, guarantees null-termination (`\0`), and sets the initial balance.
      - snippet: |-
          void init_account(BankAccount account, const char* owner, int balance) {
              strncpy(account.owner, owner, sizeof(account.owner) - 1);
              account.owner[sizeof(account.owner) - 1] = '\0';
              account.balance = balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. In C, passing `BankAccount account` by value receives a copy of the struct. Modifying `account.balance` modifies only the local stack copy, leaving the caller's struct uninitialized.
  - type: block
    group: bank-functions
    location:
      snippet: |-
        int deposit(BankAccount* account, int amount) {
            if (amount > 0) {
                account->balance = account->balance + amount;
                printf("Deposited %d\n", amount);
            }
            return account->balance;
        }
    choices:
      - snippet: |-
          int deposit(BankAccount* account, int amount) {
              if (amount > 0) {
                  account->balance = account->balance + amount;
                  printf("Deposited %d\n", amount);
              }
              return account->balance;
          }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `account->balance`, prints confirmation, and returns the updated balance.
  - type: block
    group: bank-functions
    location:
      snippet: |-
        int withdraw(BankAccount* account, int amount) {
            if (0 < amount && amount <= account->balance) {
                account->balance = account->balance - amount;
                printf("Withdrew %d\n", amount);
            } else {
                printf("Insufficient funds\n");
            }
            return account->balance;
        }
    choices:
      - snippet: |-
          int withdraw(BankAccount* account, int amount) {
              if (0 < amount && amount <= account->balance) {
                  account->balance = account->balance - amount;
                  printf("Withdrew %d\n", amount);
              } else {
                  printf("Insufficient funds\n");
              }
              return account->balance;
          }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Verifies that `0 < amount && amount <= account->balance`, debits the account when funds are sufficient, prints an error message when funds are insufficient, and returns `account->balance`.
      - snippet: |-
          int withdraw(BankAccount* account, int amount) {
              account->balance = account->balance - amount;
              printf("Withdrew %d\n", amount);
              return account->balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= account->balance`, allowing the account balance to plunge into negative numbers.
